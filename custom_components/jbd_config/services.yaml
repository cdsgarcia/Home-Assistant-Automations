read_config:
  name: Read JBD BMS config
  description: Read Cell Full Voltage and balance settings (nothing is written).
  fields:
    pack:
      name: Pack
      description: Pack names from configuration.yaml (default all).
      example: '["M1"]'
      selector:
        text:
          multiple: true
    registers:
      name: Raw registers
      description: Extra EEPROM register addresses to read (diagnostics), e.g. 0x12-0x13, 0x32-0x35.
      example: "[18, 19, 50, 51, 52, 53]"
      selector:
        object:

esup_read:
  name: Read ES-UP parameters (read-only)
  description: >-
    Query the newer JBD "ES-UP" protocol (fn 0x78) for FullAdjustV/FullAdjustC (the real 100% SOC
    reset threshold on UP16S firmware), capacity and the factory mirror. Nothing is written.
  fields:
    pack:
      name: Pack
      description: Pack names (default all).
      example: '["M1"]'
      selector:
        text:
          multiple: true
    addresses:
      name: Addresses
      description: ES-UP device addresses to try in order (default last found, then 1, 2, 3, 4, 0).
      example: "[1]"
      selector:
        object:
    blocks:
      name: Blocks
      description: user_params (0x1C00), capacity (0x2000), factory_mirror (0x3900). Default all.
      example: '["user_params"]'
      selector:
        object:

esup_set:
  name: Set ES-UP full-charge reset point
  description: >-
    Write FullAdjustV/FullAdjustC (ES-UP fn 0x79, only values that differ), then verify in a fresh
    session. SOC resets to 100% when the pack is at or above this voltage and the charge current
    has fallen to this current.
  fields:
    pack:
      name: Pack
      description: Pack names (default all).
      example: '["M1"]'
      selector:
        text:
          multiple: true
    addresses:
      name: Addresses
      description: ES-UP device addresses to try in order (default last found, then 1, 2, 3, 4, 0).
      example: "[1]"
      selector:
        object:
    full_adjust_v:
      name: Full charge voltage
      example: 56.0
      selector:
        number:
          min: 52.0
          max: 58.4
          step: 0.01
          unit_of_measurement: V
    full_adjust_c:
      name: Full charge current
      example: 2.0
      selector:
        number:
          min: 0.5
          max: 30.0
          step: 0.01
          unit_of_measurement: A

set_config:
  name: Set JBD BMS config
  description: >-
    Write only the given settings (skipped if already equal), then verify in a fresh session.
  fields:
    pack:
      name: Pack
      description: Pack names from configuration.yaml (default all).
      example: '["M1", "S1", "S2"]'
      selector:
        text:
          multiple: true
    cell_full_mv:
      name: Cell Full Voltage
      description: SOC resets to 100% when any cell reaches this (mV).
      example: 3500
      selector:
        number:
          min: 3400
          max: 3650
          unit_of_measurement: mV
    balance_start_mv:
      name: Balance start voltage
      example: 3400
      selector:
        number:
          min: 3300
          max: 3600
          unit_of_measurement: mV
    balance_delta_mv:
      name: Balance delta
      example: 8
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: mV
