read_config:
  name: Read JBD BMS config
  description: Read Cell Full Voltage and balance settings (nothing is written).
  fields:
    pack:
      name: Pack
      description: Pack names from configuration.yaml (default all).
      example: '["M1"]'
      selector:
        text:
          multiple: true
    registers:
      name: Raw registers
      description: Extra EEPROM register addresses to read (diagnostics), e.g. 0x12-0x13, 0x32-0x35.
      example: "[18, 19, 50, 51, 52, 53]"
      selector:
        object:

esup_read:
  name: Read ES-UP parameters (read-only)
  description: >-
    Query the newer JBD "ES-UP" protocol (fn 0x78) for FullAdjustV/FullAdjustC (the real 100% SOC
    reset threshold on UP16S firmware), capacity and the factory mirror. Nothing is written.
  fields:
    pack:
      name: Pack
      description: Pack names (default all).
      example: '["M1"]'
      selector:
        text:
          multiple: true
    addresses:
      name: Addresses
      description: ES-UP device addresses to try in order (default 1, 0, 2, 3, 4).
      example: "[1]"
      selector:
        object:
    blocks:
      name: Blocks
      description: user_params (0x1C00), capacity (0x2000), factory_mirror (0x3900). Default all.
      example: '["user_params"]'
      selector:
        object:

set_config:
  name: Set JBD BMS config
  description: >-
    Write only the given settings (skipped if already equal), then verify in a fresh session.
  fields:
    pack:
      name: Pack
      description: Pack names from configuration.yaml (default all).
      example: '["M1", "S1", "S2"]'
      selector:
        text:
          multiple: true
    cell_full_mv:
      name: Cell Full Voltage
      description: SOC resets to 100% when any cell reaches this (mV).
      example: 3500
      selector:
        number:
          min: 3400
          max: 3650
          unit_of_measurement: mV
    balance_start_mv:
      name: Balance start voltage
      example: 3400
      selector:
        number:
          min: 3300
          max: 3600
          unit_of_measurement: mV
    balance_delta_mv:
      name: Balance delta
      example: 8
      selector:
        number:
          min: 5
          max: 50
          unit_of_measurement: mV
