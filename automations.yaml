- id: '1780125525364'
  alias: A/C Auto Set
  description: ''
  triggers:
  - entity_id: sensor.a_c_power_meter_power_filtered_5m
    above: 720
    trigger: numeric_state
  - entity_id: sensor.a_c_power_meter_power_filtered_5m
    below: 500
    trigger: numeric_state
  - entity_id:
    - climate.ac
    attribute: current_temperature
    trigger: state
    for:
      hours: 0
      minutes: 5
      seconds: 0
  - entity_id:
    - climate.ac
    attribute: temperature
    for:
      hours: 0
      minutes: 5
      seconds: 0
    trigger: state
  - entity_id:
    - climate.ac
    attribute: temperature
    for:
      hours: 0
      minutes: 30
      seconds: 0
    trigger: state
  conditions:
  - condition: state
    entity_id: climate.ac
    state: cool
  - condition: time
    after: 08:00:00
    before: '20:00:00'
  - condition: template
    value_template: '{{ 16 <= state_attr(''climate.ac'', ''temperature'') | float(None)
      <= 27 }}

      '
  actions:
  - variables:
      power: '{{ states(''sensor.a_c_power_meter_power_filtered_5m'') | float(0) }}'
      current_temp: '{{ state_attr(''climate.ac'', ''temperature'') | float(0) }}'
      current_room_temp: '{{ state_attr(''climate.ac'', ''current_temperature'') |
        float(0) }}'
      target_min: 24
      target_max: 27
      target_low: 500
      target_high: 720
      power_cooldown: 300
      temp_sync_cooldown: 1800
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ power > target_high and current_temp < target_max and
          (as_timestamp(now()) - as_timestamp(states(''input_datetime.a_c_last_adjusted''),
          0)) > power_cooldown }}

          '
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ac
        data:
          temperature: '{{ current_temp + 1 }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.a_c_last_adjusted
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: template
        value_template: '{{ power < target_low and current_temp > target_min and (as_timestamp(now())
          - as_timestamp(states(''input_datetime.a_c_last_adjusted''), 0)) > power_cooldown
          }}

          '
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ac
        data:
          temperature: '{{ current_temp - 1 }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.a_c_last_adjusted
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: template
        value_template: '{{ current_temp > current_room_temp and power < target_high
          and (as_timestamp(now()) - as_timestamp(states(''input_datetime.a_c_last_adjusted''),
          0)) > temp_sync_cooldown }}'
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ac
        data:
          temperature: '{{ (current_temp - 1) | round(1) }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.a_c_last_adjusted
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    - conditions:
      - condition: template
        value_template: '{{ current_temp < current_room_temp and power < target_high
          and (as_timestamp(now()) - as_timestamp(states(''input_datetime.a_c_last_adjusted''),
          0)) > temp_sync_cooldown }}'
      sequence:
      - action: climate.set_temperature
        target:
          entity_id: climate.ac
        data:
          temperature: '{{ (current_temp + 1) | round(1) }}'
      - action: input_datetime.set_datetime
        target:
          entity_id: input_datetime.a_c_last_adjusted
        data:
          datetime: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    default: []
  mode: single
