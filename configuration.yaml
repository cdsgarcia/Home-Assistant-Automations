
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

template:
  - sensor:
      - name: "Grid L1 Power Signed"
        unique_id: grid_l1_power_signed
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        icon: mdi:transmission-tower-export
        state: >
          {% set raw = states('sensor.srne_grid_l1_power') | int(0) %}
          {% if raw > 32767 %}
            {{ (raw - 65536) * -1 }}
          {% else %}
            {{ raw * -1 }}
          {% endif %}

      - name: "Today Battery Charge kWatt-Hour"
        unique_id: today_battery_charge_kwatt_hour
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:battery-plus
        state: >-
          {{ ((states('sensor.srne_today_battery_charge_ampere_hour') | float(0)) *
          (states('sensor.srne_battery_voltage') | float(0)) / 1000) | round(2) }}

      - name: Today Battery Discharge kWatt-Hour
        unique_id: today_battery_discharge_kwatt_hour
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total
        icon: mdi:battery-minus
        state: >-
          {{ ((states('sensor.srne_today_battery_discharge_ampere_hour') | float(0)) *
          (states('sensor.srne_battery_voltage') | float(0)) / 1000) | round(2) }}

      - name: "Total Battery Power Absolute"
        unique_id: total_battery_power_absolute
        unit_of_measurement: "W"
        icon: mdi:flash
        state: "{{ states('sensor.total_battery_power') | float(0) | abs }}"
        device_class: "power"
        state_class: "measurement"

      - name: "PV Power kW"
        unique_id: sensor.srne_pv_power_kw
        unit_of_measurement: ""
        icon: mdi:flash
        state:  "{{ states('sensor.srne_pv_power') | float(0) / 1000 | round(1) }}"
        device_class: "power"
        state_class: "measurement"

      - name: "Total Battery Power kW"
        unique_id: sensor.total_battery_power_kw
        unit_of_measurement: ""
        icon: mdi:flash
        state:  "{{ states('sensor.total_battery_power') | float(0) / 1000 | round(1) }}"
        device_class: "power"
        state_class: "measurement"

      - name: "Total Battery Power Absolute kW"
        unique_id: sensor.total_battery_power_absolute_kw
        unit_of_measurement: ""
        icon: mdi:flash
        state:  "{{ states('sensor.total_battery_power_absolute') | float(0) / 1000 | round(1) }}"
        device_class: "power"
        state_class: "measurement"

      - name: "Battery Reached Full Today"
        unique_id: sensor.battery_reached_full_today
        state: >
          {{ 'YES' if is_state('input_boolean.battery_reached_100_today', 'on') else 'NO' }}
        icon: >
          {{ 'mdi:battery-check' if is_state('input_boolean.battery_reached_100_today', 'on') else 'mdi:battery-remove' }}

      - name: "Battery SOC Mean"
        unique_id: battery_soc_mean
        unit_of_measurement: "%"
        device_class: battery
        state_class: measurement
        icon: mdi:battery
        state: >
          {# Capacity-weighted mean SOC across all packs (rated Ah, update if a pack is added/replaced). #}
          {# A brief dropout (<5 min) on one pack holds the last computed mean instead of going #}
          {# unavailable, so a momentary BLE blip can't reset/re-arm numeric_state 'for:' triggers #}
          {# on the automations that consume this sensor. A real prolonged outage (>=5 min) still #}
          {# reports 'unavailable' rather than a skewed or stale-forever average. #}
          {% set packs = [
            ('sensor.m1_ble_battery', 100),
            ('sensor.s1_ble_battery', 100),
            ('sensor.s2_ble_battery', 100),
            ('sensor.cst_ble_battery', 324)
          ] %}
          {% set ns = namespace(charge=0, capacity=0, all_ok=true, stale=false) %}
          {% for entity_id, ah in packs %}
            {% set st = states[entity_id] %}
            {% set soc = st.state | float(none) if st else none %}
            {% if soc is none %}
              {% set ns.all_ok = false %}
              {% if not st or (as_timestamp(now()) - as_timestamp(st.last_changed, 0)) > 300 %}
                {% set ns.stale = true %}
              {% endif %}
            {% else %}
              {% set ns.charge = ns.charge + (soc * ah) %}
              {% set ns.capacity = ns.capacity + ah %}
            {% endif %}
          {% endfor %}
          {% if ns.all_ok %}
            {{ (ns.charge / ns.capacity) | round(1) }}
          {% elif ns.stale or this.state in ['unknown', 'unavailable', none] %}
            unavailable
          {% else %}
            {{ this.state }}
          {% endif %}

sensor:
  - platform: statistics
    name: "A/C Power Meter Power Filtered 5m"
    entity_id: sensor.a_c_1f_power_meter_power
    state_characteristic: mean
    max_age:
      minutes: 5

  - platform: statistics
    name: "A/C Power Meter Power Filtered 10m"
    entity_id: sensor.a_c_1f_power_meter_power
    state_characteristic: mean
    max_age:
      minutes: 10

  - platform: statistics
    name: "A/C Power Meter Power Filtered 30m"
    entity_id: sensor.a_c_1f_power_meter_power
    state_characteristic: mean
    max_age:
      minutes: 30

# JBD (Gentai) BMS settings over BLE - services jbd_config.read_config / set_config.
# Needs custom_components/jbd_config. Password defaults to the vendor default; add
# `password: !secret ...` per pack if yours differs.
jbd_config:
  packs:
    - name: M1
      address: AA:C2:37:01:B9:02
    - name: S1
      address: AA:C2:37:01:DB:D7
    - name: S2
      address: AA:C2:37:01:E0:7F
