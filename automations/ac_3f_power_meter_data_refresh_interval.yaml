- id: '1775715616178'
  alias: 'A/C 3F Power Meter - Data Refresh Interval '
  description: ''
  triggers:
  - trigger: homeassistant
    event: start
  - trigger: numeric_state
    entity_id:
    - number.a_c_3f_power_meter_data_refresh_interval
    above: 30
  - trigger: numeric_state
    entity_id:
    - number.a_c_3f_power_meter_data_refresh_interval
    below: 30
  conditions:
  - condition: or
    conditions:
    - condition: numeric_state
      entity_id: number.a_c_3f_power_meter_data_refresh_interval
      above: 30
    - condition: numeric_state
      entity_id: number.a_c_3f_power_meter_data_refresh_interval
      below: 30
  actions:
  - action: number.set_value
    metadata: {}
    target:
      entity_id: number.a_c_3f_power_meter_data_refresh_interval
    data:
      value: '30'
  mode: single
