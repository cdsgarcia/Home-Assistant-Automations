- id: '1780315038964'
  alias: A/C Night OFF Sequence - SOC
  description: ''
  triggers:
  - id: trigger_morning
    trigger: numeric_state
    entity_id:
    - sensor.srne_battery
    for:
      hours: 0
      minutes: 1
      seconds: 0
    below: 15
  - id: trigger_evening
    trigger: numeric_state
    entity_id:
    - sensor.srne_battery
    for:
      hours: 0
      minutes: 1
      seconds: 0
    below: 20
  conditions:
  - condition: or
    conditions:
    - condition: and
      conditions:
      - condition: time
        after: 02:00:00
        before: 07:00:00
      - condition: trigger
        id: trigger_morning
    - condition: and
      conditions:
      - condition: time
        after: '21:00:00'
        before: 02:00:00
      - condition: trigger
        id: trigger_evening
  - condition: not
    conditions:
    - condition: device
      device_id: f0ac383606adb08783dd4317b30b7514
      domain: climate
      entity_id: 6b825ba36b730908c201d9cba94b685a
      type: is_hvac_mode
      hvac_mode: 'off'
  actions:
  - action: climate.set_temperature
    metadata: {}
    data:
      temperature: 30
    target:
      device_id: f0ac383606adb08783dd4317b30b7514
  - delay:
      hours: 0
      minutes: 0
      seconds: 10
      milliseconds: 0
  - device_id: f0ac383606adb08783dd4317b30b7514
    domain: climate
    entity_id: 6b825ba36b730908c201d9cba94b685a
    type: set_hvac_mode
    hvac_mode: fan_only
  - delay:
      hours: 0
      minutes: 15
      seconds: 0
      milliseconds: 0
  - device_id: f0ac383606adb08783dd4317b30b7514
    domain: climate
    entity_id: 6b825ba36b730908c201d9cba94b685a
    type: set_hvac_mode
    hvac_mode: 'off'
  mode: single
