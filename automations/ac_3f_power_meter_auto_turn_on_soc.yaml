- id: '1780450934568'
  alias: A/C 3F Power Meter - Auto Turn On SOC
  triggers:
  - trigger: state
    entity_id: input_boolean.battery_reached_100_today
    from: 'off'
    to: 'on'
  actions:
  - if:
    - condition: state
      entity_id: automation.a_c_3f_power_meter_auto_turn_on
      state: 'off'
    then:
    - action: automation.turn_on
      target:
        entity_id: automation.a_c_3f_power_meter_auto_turn_on
  - if:
    - condition: device
      type: is_off
      device_id: 73be0b81a93c4901708d886e1f886fee
      entity_id: 76a0b938088c515fa8bce65d7e02aaf2
      domain: switch
    then:
    - type: turn_on
      device_id: 73be0b81a93c4901708d886e1f886fee
      entity_id: 76a0b938088c515fa8bce65d7e02aaf2
      domain: switch
  mode: single
